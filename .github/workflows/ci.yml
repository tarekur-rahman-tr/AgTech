name: AgTech CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types
        run: pnpm generate:types
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/agtech_ci
          PAYLOAD_SECRET: ci-only-secret-do-not-use-in-production

      - name: Type check
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/agtech_ci
          PAYLOAD_SECRET: ci-only-secret-do-not-use-in-production
          NEXT_TELEMETRY_DISABLED: '1'
